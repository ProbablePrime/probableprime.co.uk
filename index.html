<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>ProbablePrime - Hello!</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.0/" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flexboxgrid/6.3.1/flexboxgrid.min.css"
        type="text/css">
    <link rel="stylesheet" href="socicon.css">
</head>
<style type="text/css">
    * {
        font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
        height: 100%;
        overflow: hidden;
        background-color: #3C7FB1;
    }

    .v {
        height: 100%;
        display: flex;
        justify-content: center;
        flex-direction: column;
    }

    .inline-socicon {
        font-size: 3em;
        color: #FFF;
        border-radius: 35px;
        padding: 12px;
    }

    a {
        color: inherit;
        text-decoration: inherit;
    }

    .icons {
        margin-top: 25px;
        margin-bottom: 50px;
    }

    .socicon-mixer {
        background-color: #1FBAED;
    }

    .socicon-discord {
        background-color: #7289da;
    }

    .socicon-github {
        background-color: #221e1b;
    }

    .socicon-twitter {
        background-color: #4da7de;
    }

    .socicon-bluesky {
        background-color: #1889FE;
    }

    .socicon-medium {
        background-color: #000;
    }

    .socicon-youtube {
        background-color: #e52d27;
    }

    .socicon-twitch {
        background-color: #6441a5;
    }

    .socicon-patreon {
        background-color: #FF424E;
    }

    .col-md-1 {
        display: flex;
        justify-content: center;
    }

    .kofi img {
        width: 300px;
    }

    * {
        color: white;
        font-family: Arial, Helvetica, sans-serif;
    }

    .text {
        margin-top: 25px;
        margin-bottom: 25px;
        font-size: 1.2em;
        font-weight: bold;
    }

    .seven a {
        color: #1C7CA9 !important;
        font-size: 2em;
    }

    .startups {
        margin-top: 25px;
        margin-bottom: 25px;
    }

    .startup-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 25px;
        height: 120px;
        min-width: 220px;
        width: 100%;
    }

    .startup-logo {
        height: 100px;
        margin-bottom: 8px;
        object-fit: cover;
    }

    .startup-info {
        text-align: center;
    }

    .startup-name {
        font-size: 1.3em;
        font-weight: bold;
        margin-bottom: 3px;
    }

    .startup-years {
        font-size: 1.1em;
    }

    .col-startup {
        display: flex;
        justify-content: center;
    }
    .tagline {
        font-size: 1.5em;
    }
</style>
</head>

<body>
    <div class="v">
        <div class="row center-xs">
            <div class="col-sm-4 col-md-12 f">
                <a href="https://twitter.com/probableprime"><img src="logo.png" alt="ProbablePrime's Logo" /></a>
            </div>
        </div>
        <div class="row center-xs text">
            <div class="col-sm-4 col-md-12 f tagline">
                Hi, I'm ProbablePrime, I make stuff for VR. Find me below on various places.
            </div>
        </div>
        <div class="row center-xs icons">
            <div class="col-sm-4 col-md-1 f">
                <a href="https://github.com/ProbablePrime" target="_blank" name="github">
                    <span class="inline-socicon socicon-github"></span>
                </a>
            </div>
            <div class="col-sm-4 col-md-1 f">
                <a href="https://twitter.com/ProbablePrime" target="_blank" name="twitter">
                    <span class="inline-socicon socicon-twitter"></span>
                </a>
            </div>
            <div class="col-sm-4 col-md-1 f">
                <a href="https://bsky.app/profile/probableprime.bsky.social" target="_blank" name="bluesky">
                    <span class="inline-socicon socicon-bluesky"></span>
                </a>
            </div>
            <div class="col-sm-4 col-md-1 f">
                <a href="https://twitch.tv/ProbablePrime" target="_blank" name="twitch">
                    <span class="inline-socicon socicon-twitch"></span>
                </a>
            </div>
            <div class="col-sm-4 col-md-1 f">
                <a href="https://www.youtube.com/c/ProbablePrime" target="_blank" name="youtube">
                    <span class="inline-socicon socicon-youtube"></span>
                </a>
            </div>
            <div class="col-sm-4 col-md-1 f discord">
                <a href="https://discord.com/users/82992971921752064" target="_blank" name="discord">
                    <span class="inline-socicon socicon-discord"></span>
                </a>
            </div>
            <div class="col-sm-4 col-md-1 f">
                <a href="https://www.patreon.com/probableprime" target="_blank" name="patreon">
                    <span class="inline-socicon socicon-patreon"></span>
                </a>
            </div>
        </div>
        <div class="row center-xs startups">
            <div class="col-sm-6 col-md-3 col-startup">
                <a href="https://www.linkedin.com/company/tag-heuer-track-intelligence/" target="_blank">
                    <div class="startup-item">
                        <img src="images/trackintel.png" class="startup-logo">
                        <div class="startup-info">
                            <div class="startup-name">Track Intelligence</div>
                            <div class="startup-years">2011 - 2016</div>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-sm-6 col-md-3 col-startup">
                <a href="https://en.wikipedia.org/wiki/Mixer_(service)" target="_blank">
                    <div class="startup-item">
                        <img src="images/mixer.png" class="startup-logo">
                        <div class="startup-info">
                            <div class="startup-name">Mixer</div>
                            <div class="startup-years">2016 - 2022</div>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-sm-6 col-md-3 col-startup">
                <a href="https://resonite.com" target="_blank">
                    <div class="startup-item">
                        <img src="images/resonite.png" class="startup-logo">
                        <div class="startup-info">
                            <div class="startup-name">Resonite</div>
                            <div class="startup-years">2020 - <strong>Present</strong></div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
        <div class="row center-xs">
            <div class="col-sm-4 col-md-12 kofi">
                <a href="https://ko-fi.com/probableprime" target="_blank">
                    <img src="kofi.png" alt="Image incentivize you to buy me a Coffee on Kofi" />
                </a>
            </div>
        </div>
        <!-- New Row here -->
        <div class="row center-xs seven">
            <div class="col-sm-4 col-md-12 kofi">
                <a href="/7" target="_blank">
                    7
                </a>
            </div>
        </div>
    </div>

</body>

</html>
