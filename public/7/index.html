
<html>

	<head>
		<meta name="viewport" content="width=device-width, maximum-scale=1">
		<title>7</title>
		<style>
			body {
				background-color: #1e88e5;
				overflow: hidden;
			}
	
			img {
				margin: 0 auto;
			}
	
			#cheese {
				position: absolute;
				top: 50%;
				left: 50%;
				width: 23vmax;
				height: 40vmin;
				background: url('7.png') center / contain no-repeat;
				transform: translate(-50%, -50%);
				animation: mover 1s infinite alternate;
			}
	
			#cheese:hover {
				-webkit-animation: mover2 200ms infinite alternate;
				animation: mover2 200ms infinite alternate;
				cursor: pointer;
			}
	
			.cheese-hyper {
				-webkit-animation: mover2 200ms infinite alternate;
				animation: mover2 200ms infinite alternate;
			}
	
	
			@-webkit-keyframes mover {
				0% {
					margin-top: 0;
				}
				100% {
					margin-top: -20px;
				}
			}
	
			@keyframes mover {
				0% {
					margin-top: 0;
				}
				100% {
					margin-top: -20px;
				}
			}
	
			@-webkit-keyframes mover2 {
				0% {
					margin-top: 0;
				}
				100% {
					margin-top: -60px;
				}
			}
	
			@keyframes mover2 {
				0% {
					margin-top: 0;
				}
				100% {
					margin-top: -60px;
				}
			}
	
			@-webkit-keyframes sunburst {
				0% {
					transform: rotateZ(0);
				}
				100% {
					transform: rotateZ(20deg);
				}
			}
	
			@keyframes sunburst {
				0% {
					transform: rotateZ(0);
				}
				100% {
					transform: rotateZ(20deg);
				}
			}
	
			.sunburst {
				position: fixed;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
				animation: sunburst 1s infinite linear forwards;
			}
	
			.sunburst-hyper {
				animation: sunburst 250ms infinite linear forwards;
			}
	
			.sunburst b {
				position: absolute;
				top: 50%;
				left: 50%;
	
				display: block;
				width: 0;
				height: 0;
	
				margin-top: -5vmax;
				margin-left: -70vmax;
				border-width: 5vmax 70vmax;
				border-color: transparent #FFF;
				border-style: solid;
			}
	
			.sunburst b:nth-child(1) {
				transform: rotate(20deg);
			}
	
			.sunburst b:nth-child(2) {
				transform: rotate(40deg);
			}
	
			.sunburst b:nth-child(3) {
				transform: rotate(60deg);
			}
	
			.sunburst b:nth-child(4) {
				transform: rotate(80deg);
			}
	
			.sunburst b:nth-child(5) {
				transform: rotate(100deg);
			}
	
			.sunburst b:nth-child(6) {
				transform: rotate(120deg);
			}
	
			.sunburst b:nth-child(7) {
				transform: rotate(140deg);
			}
	
			.sunburst b:nth-child(8) {
				transform: rotate(160deg);
			}
	
			.sunburst b:nth-child(9) {
				transform: rotate(180deg);
			}
		</style>
	</head>
	
	<body>
		<div class="sunburst">
			<div class="outer">
				<b></b>
				<b></b>
				<b></b>
				<b></b>
				<b></b>
				<b></b>
				<b></b>
				<b></b>
				<b></b>
				<b></b>
			</div>
		</div>
	
		<div id="cheese"></div>
		<audio class="sfx-1" src="71.mp3"></audio>
		<audio class="sfx-2" src="72.mp3"></audio>
		<audio class="sfx-3" src="73.mp3"></audio>
		<audio class="sfx-4" src="74.mp3"></audio>
		<audio class="sfx-5" src="75.mp3"></audio>
		<audio class="sfx-6" src="76.mp3"></audio>
		<audio class="sfx-7" src="77.mp3"></audio>

	
		<script>
			document.querySelector('#cheese').onclick = function () {
				var i = Math.floor(Math.random() * (7 - 1 + 1)) + 1;
				console.log('audio .sfx-' + i);
				document.querySelector('.sfx-' + i).play();
			}
		</script>
	</body>
	
	</html>
