# Build scripts: allow only what each runtime needs; rest false so
# strictDepBuilds (pnpm >=10.26 / 11) passes.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false

# Supply-chain hardening: cooldown on brand-new releases (EmDash exempt)
# and no non-registry transitive sources. (No trustPolicy: no-downgrade --
# it trips on upstream provenance regressions we don't control.)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - emdash
  - "@emdash-cms/*"
blockExoticSubdeps: true

# @astrojs/check -> astro2tsx -> @napi-rs/wasm-runtime has @emnapi/runtime as a
# peer; pnpm otherwise picks 2.0.0-beta.2, which doesn't match the pinned
# @emnapi/core 1.11.3 and crashes `astro check` ("bridge.deleteEnv is not a function").
overrides:
  "@napi-rs/wasm-runtime@1.2.4>@emnapi/runtime": 1.11.3
